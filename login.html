<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - School Management System</title>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Icons -->
  <link rel="preload" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css" as="style">
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>
  <link rel="stylesheet" href="/css/loader.css">
  <script src="/js/core/loader-init.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="/css/login.css">
  <link rel="icon" type="image/jpeg" href="/img/1.jpg">

  <style>
    * {
      font-family: 'Kantumruy Pro', sans-serif;
    }
  </style>
</head>

<body>

  <div id="customAlert"></div>





  <!-- Animated Background Shapes -->
  <div class="background-shape shape-1"></div>
  <div class="background-shape shape-2"></div>
  <div class="background-shape shape-3"></div>

  <div class="login-container">
    <div class="login-header">
      <div class="logo-container" id="login-logo-container">
        <img src="/img/1.jpg" alt="Logo" class="logo-img" 
             onerror="document.getElementById('login-logo-container').style.display='none'">
      </div>
      <h2 class="school-title">សាលាអន្តរជាតិ ធាន ស៊ីន</h2>
      <p class="school-subtitle">ប្រព័ន្ធគ្រប់គ្រងសាលារៀន (School Management System)</p>
    </div>

    <form id="loginForm">
      <div class="input-group">
        <i class="fi fi-rr-envelope input-icon"></i>
        <input type="text" id="username" placeholder="អ៊ីមែល (Email)" required autocomplete="username" autofocus>
      </div>

      <div class="input-group">
        <i class="fi fi-rr-lock input-icon"></i>
        <input type="password" id="password" placeholder="ពាក្យសម្ងាត់ (Password)" required autocomplete="current-password">
        <i class="fi fi-rr-eye toggle-password" id="togglePassword" title="បង្ហាញ/លាក់ ពាក្យសម្ងាត់"></i>
      </div>

      <button type="submit" id="loginBtn" class="btn-login">
        <i class="fi fi-rr-sign-in-alt"></i>
        <span>ចូលប្រព័ន្ធ (Login)</span>
      </button>
    </form>

    <p class="footer-text">© <span id="currentYear">2026</span> Tian Xin School. All rights reserved.</p>
  </div>

  <!-- Firebase SDKs (Version 9.6.1 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

  <!-- Custom Scripts -->
  <script src="/js/core/firebase-config.js?v=20261021"></script>
  <script src="/js/pages/login.js"></script>

  <script src="/js/core/offline-manager.js"></script>

</body>

</html>
